<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900">
  <!-- Furina: Fontaine's opera stage — a top hat, the masks of comedy and tragedy, Hydro bubbles and waves. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4a8fe8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4a8fe8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d4f9a"/>
      <stop offset="1" stop-color="#15234a"/>
    </linearGradient>
    <radialGradient id="bub" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#9fd0ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4a8fe8" stop-opacity="0.15"/>
    </radialGradient>
  </defs>
  <circle cx="340" cy="430" r="310" fill="url(#glow)"/>
  <!-- Arched stage frame -->
  <path d="M130 860V330C130 190 230 110 340 110S550 190 550 330V860" fill="none" stroke="#d8c07a" stroke-opacity="0.55" stroke-width="3"/>
  <path d="M150 860V336C150 206 240 132 340 132S530 206 530 336V860" fill="none" stroke="#d8c07a" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="4 8"/>
  <!-- Top hat, tilted -->
  <g transform="translate(350 330) rotate(-12)">
    <ellipse cy="70" rx="130" ry="26" fill="url(#hat)" stroke="#d8c07a" stroke-width="3"/>
    <path d="M-80 66V-70C-80-92 80-92 80-70V66Z" fill="url(#hat)" stroke="#d8c07a" stroke-width="3"/>
    <rect x="-80" y="20" width="160" height="28" fill="#f4f7ff"/>
    <path d="M40 34l34-26v52Z" fill="#4a8fe8"/>
    <path d="M40 34l30 30-10 4Z" fill="#2d63c0"/>
    <circle cx="40" cy="34" r="10" fill="#d8c07a"/>
  </g>
  <!-- Comedy & tragedy masks -->
  <g transform="translate(250 600) rotate(-14)" fill="#f4f7ff" fill-opacity="0.85">
    <path d="M-44-40C-20-52 20-52 44-40 48 0 30 40 0 48-30 40-48 0-44-40Z"/>
    <g fill="#15234a"><path d="M-26-16q10-10 20 0q-10 4-20 0Z"/><path d="M6-16q10-10 20 0q-10 4-20 0Z"/><path d="M-18 14q18 18 36 0q-18 6-36 0Z"/></g>
  </g>
  <g transform="translate(360 640) rotate(16)" fill="#9fd0ff" fill-opacity="0.8">
    <path d="M-40-36C-18-48 18-48 40-36 44 0 28 36 0 44-28 36-44 0-40-36Z"/>
    <g fill="#15234a"><path d="M-24-10q10 8 18 0q-10-6-18 0Z"/><path d="M6-10q10 8 18 0q-10-6-18 0Z"/><path d="M-14 24q14-14 28 0q-14-4-28 0Z"/></g>
  </g>
  <g fill="url(#bub)" stroke="#cfe6ff" stroke-opacity="0.6">
    <circle cx="170" cy="200" r="30"/><circle cx="520" cy="520" r="22"/><circle cx="470" cy="190" r="14"/>
    <circle cx="110" cy="470" r="18"/><circle cx="500" cy="760" r="34"/><circle cx="210" cy="760" r="12"/>
    <circle cx="560" cy="380" r="10"/><circle cx="420" cy="820" r="9"/>
  </g>
  <g fill="none" stroke="#6fb0f5" stroke-linecap="round">
    <path d="M60 860c40-30 80-30 120 0s80 30 120 0 80-30 120 0 80 30 120 0" stroke-width="5" stroke-opacity="0.6"/>
    <path d="M40 890c40-24 80-24 120 0s80 24 120 0 80-24 120 0 80 24 120 0 80-24 120 0" stroke-width="3" stroke-opacity="0.4"/>
  </g>
</svg>
