  </g>
  <g stroke="#4f8a3a" stroke-width="3" stroke-opacity="0.6"><path d="M512 180h16M512 380h16M512 580h16M564 260h12M564 480h12"/></g>
  <g fill="#6fae55" fill-opacity="0.6">
