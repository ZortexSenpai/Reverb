# Push to main → next version → draft release → all-platform builds → publish.
# See RELEASING.md.
#
# Every push to main runs scripts/next-version.mjs over the conventional
# commits since the last stable vX.Y.Z tag. If they call for a release, it tags
# the pushed commit and opens a *draft* release with the notes, and the build
# jobs below stamp that version into the build and upload to the draft. The
# draft is published only once every platform has uploaded its bundles,
# signatures and latest.json entries, so installs never see a "latest" release
# without files. A push with nothing releasable (docs:, chore:, ...) stops
# after the first job.

name: Release

on:
  push:
    branches: [main]
  # Pre-releases, and a manual retry of a normal release. See RELEASING.md.
  workflow_dispatch:
    inputs:
      prerelease:
        description: >-
          Pre-release identifier, like rc, for a vX.Y.Z-rc.N pre-release. Works
          on any branch. Leave empty for a normal release, which only main makes.
        required: false
        default: ""

permissions:
  contents: write

# Never cancel a run that may be halfway through uploading to a draft.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Next version
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.draft.outputs.created }}
      id: ${{ steps.draft.outputs.id }}
      tag: ${{ steps.next.outputs.tag }}
      version: ${{ steps.next.outputs.version }}
      notes: ${{ steps.next.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit and tag: the version comes from the history since the
          # last release tag.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Work out the next version from the commits
        id: next
        env:
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ -z "$PRERELEASE" ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Only main makes normal releases. To release $GITHUB_REF_NAME, give a pre-release identifier such as rc."
            exit 1
          fi
          node scripts/next-version.mjs --prerelease "$PRERELEASE" --notes-file "$RUNNER_TEMP/notes.md"
      # The tag goes up now, not when the draft is published: a release whose
      # build fails keeps its version, and the next push moves past it
      # (RELEASING.md, When a build fails).
      - name: Tag the commit and open a draft release
        id: draft
        if: steps.next.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next.outputs.tag }}
          PRERELEASE: ${{ steps.next.outputs.prerelease }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          id=$(jq -n --arg tag "$TAG" --rawfile body "$RUNNER_TEMP/notes.md" --argjson prerelease "$PRERELEASE" \
              '{tag_name: $tag, name: $tag, body: $body, draft: true, prerelease: $prerelease}' \
            | gh api "repos/$GITHUB_REPOSITORY/releases" --input - --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"
          { echo "Draft release **$TAG** opened."; echo; cat "$RUNNER_TEMP/notes.md"; } >> "$GITHUB_STEP_SUMMARY"

  signing-key:
    name: Check signing key
    needs: version
    if: needs.version.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Tauri CLI only warns when the key it signs with doesn't match the
      # public key the app ships, and every install would then refuse the
      # update. Prove the pair matches before spending an hour on builds.
      - name: Sign a probe file and verify it against tauri.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "probe" > "$RUNNER_TEMP/probe.txt"
          npx tauri signer sign "$RUNNER_TEMP/probe.txt"
          node scripts/check-updater-key.mjs "$RUNNER_TEMP/probe.txt"

  build:
    name: Build (${{ matrix.platform }})
    needs: [version, signing-key]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-latest
            # One download for Apple Silicon and Intel.
            args: --target universal-apple-darwin
          - platform: windows
            runner: windows-latest
            args: ""
          - platform: linux
            # The oldest supported runner sets the glibc floor (2.35: Ubuntu
            # 22.04, Debian 12). Moving to a newer one drops distros, which
            # makes it a major release (RELEASING.md).
            runner: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # The repository holds the placeholder 0.0.0; the release's version is
      # only in its tag. Write it into every file that carries the version
      # before anything builds, and check none was missed.
      - name: Stamp the release version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/set-version.mjs "$VERSION" && node scripts/check-versions.mjs
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        # As in CI, plus what the AppImage bundler shells out to.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libasound2-dev \
            libgtk-3-dev libdbus-1-dev pkg-config patchelf file xdg-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The rpm crate refuses the `-` in a pre-release version like
      # 1.0.0-rc.2, so the stock CLI fails the whole Linux build
      # (tauri-apps/tauri#16336). Until a Tauri release has that fix,
      # pre-release Linux builds use the CLI version package-lock.json pins,
      # built from source with the fix applied. Stable versions don't need it.
      # RELEASING.md (Pre-releases) says when to remove this.
      - name: Build a Tauri CLI that can bundle a pre-release rpm
        id: tauri-cli
        if: runner.os == 'Linux' && contains(needs.version.outputs.tag, '-')
        env:
          # It only has to bundle, not be small: skip the slow LTO build.
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: |
          version=$(node -p "require('./node_modules/@tauri-apps/cli/package.json').version")
          {
            git clone --quiet --depth 1 --branch "tauri-cli-v$version" \
              https://github.com/tauri-apps/tauri "$RUNNER_TEMP/tauri" &&
            git -C "$RUNNER_TEMP/tauri" apply \
              "$GITHUB_WORKSPACE/.github/patches/tauri-rpm-prerelease-version.patch"
          } || {
            echo "::error::Can't patch Tauri CLI $version for the rpm." \
              "See Pre-releases in RELEASING.md."
            exit 1
          }
          cargo install --path "$RUNNER_TEMP/tauri/crates/tauri-cli" --locked
          echo "script=cargo tauri" >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Upload to the draft the version job opened rather than a new one.
          releaseId: ${{ needs.version.outputs.id }}
          # Becomes `notes` in latest.json: the release notes, which the app
          # shows before installing.
          releaseBody: ${{ needs.version.outputs.notes }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
          # The patched CLI from the step above, if it ran. Empty means npm's.
          tauriScript: ${{ steps.tauri-cli.outputs.script }}

  publish:
    name: Publish release
    # Skipped unless every build succeeded: a failed platform leaves the draft
    # for a re-run, and existing installs keep seeing the previous release.
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: ${{ needs.version.outputs.id }}
    steps:
      # Each build merges its platforms into latest.json, so a lost update
      # between two of them would leave a platform out. Check before going live.
      # The `-<installer>` keys are what an install looks up first: without
      # its own, a .deb or .rpm install would fetch the AppImage instead.
      - name: Check latest.json covers every platform
        run: |
          asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.name == "latest.json") | .id')
          [ -n "$asset" ] || { echo "::error::the draft has no latest.json"; exit 1; }
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > latest.json
          for platform in \
            darwin-aarch64 darwin-aarch64-app darwin-x86_64 darwin-x86_64-app \
            windows-x86_64 windows-x86_64-nsis \
            linux-x86_64 linux-x86_64-appimage linux-x86_64-deb linux-x86_64-rpm; do
            jq -e --arg p "$platform" '.platforms[$p].url and .platforms[$p].signature' \
              latest.json > /dev/null \
              || { echo "::error::latest.json has no $platform entry"; exit 1; }
          done
      - name: Publish the draft
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false
