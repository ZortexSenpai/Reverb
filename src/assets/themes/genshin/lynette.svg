<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900">
  <!-- Lynette: a magic show — the Bogglecat Box, fanned cards, a curling cat tail and Anemo swirls. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3fbfa6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#3fbfa6" stop-opacity="0"/>
    </radialGradient>
    <g id="card">
      <rect x="-30" y="-44" width="60" height="88" rx="6" fill="#f2f5f6" stroke="#b8c4c8" stroke-width="2"/>
      <rect x="-24" y="-38" width="48" height="76" rx="3" fill="none" stroke="#3fbfa6" stroke-width="1.5"/>
    </g>
  </defs>
  <circle cx="350" cy="460" r="300" fill="url(#glow)"/>
  <!-- Anemo swirls -->
  <g fill="none" stroke="#7fe0cc" stroke-linecap="round">
    <path d="M140 260c60-80 200-60 200 30 0 60-80 70-90 20-6-30 30-40 40-16" stroke-width="5" stroke-opacity="0.55"/>
    <path d="M430 720c50-50 140-20 120 40-12 36-60 30-56 0" stroke-width="4" stroke-opacity="0.5"/>
    <path d="M90 560c30-10 70 0 90 20M100 590c24-6 50 0 64 14" stroke-width="3" stroke-opacity="0.4"/>
  </g>
  <!-- The Bogglecat Box: a gift box with cat ears -->
  <g transform="translate(360 520)">
    <path d="M-96-86l26-52 30 46ZM96-86l-26-52-30 46Z" fill="#4c5a66" stroke="#b8c4c8" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-74-100l6-20 12 16ZM74-100l-6-20-12 16Z" fill="#e8a0b0"/>
    <rect x="-110" y="-90" width="220" height="190" rx="10" fill="#34404b" stroke="#b8c4c8" stroke-width="3"/>
    <rect x="-18" y="-90" width="36" height="190" fill="#3fbfa6"/>
    <rect x="-110" y="-20" width="220" height="30" fill="#3fbfa6" fill-opacity="0.85"/>
    <!-- deadpan cat face -->
    <g stroke="#e3ecec" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M-70-50h28M42-50h28"/>
      <path d="M-10 40q10 10 20 0"/>
    </g>
    <g stroke="#b8c4c8" stroke-width="2.5" stroke-linecap="round">
      <path d="M-60 40h-34M-60 52l-30 8M60 40h34M60 52l30 8"/>
    </g>
  </g>
  <!-- Fanned playing cards -->
  <g transform="translate(200 720)">
    <use href="#card" transform="rotate(-24) translate(-10 0)"/>
    <use href="#card" transform="rotate(-6)"/>
    <use href="#card" transform="rotate(14) translate(12 4)"/>
    <path d="M18 -8l10-14 10 14-10 14Z" fill="#3fbfa6" transform="rotate(14)"/>
  </g>
  <!-- Cat tail curling up the right side -->
  <path d="M580 880C520 820 540 720 580 660S600 540 540 520" fill="none" stroke="#4c5a66" stroke-width="18" stroke-linecap="round"/>
  <path d="M548 520c-6 0-12 4-14 8" stroke="#e3ecec" stroke-width="10" stroke-linecap="round"/>
  <g fill="#7fe0cc" fill-opacity="0.8">
    <path d="M480 180l4 12 12 4-12 4-4 12-4-12-12-4 12-4Z"/>
    <path d="M110 420l3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/>
    <path d="M540 380l3 8 8 3-8 3-3 8-3-8-8-3 8-3Z"/>
  </g>
</svg>
