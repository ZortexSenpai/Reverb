<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900">
  <!-- Hu Tao: plum blossoms, a Boo Tao ghost, spirit butterflies and Pyro wisps. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e2553b" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#e2553b" stop-opacity="0"/>
    </radialGradient>
    <g id="plum">
      <g fill="#d9435e">
        <circle cy="-16" r="14"/>
        <circle cy="-16" r="14" transform="rotate(72)"/>
        <circle cy="-16" r="14" transform="rotate(144)"/>
        <circle cy="-16" r="14" transform="rotate(216)"/>
        <circle cy="-16" r="14" transform="rotate(288)"/>
      </g>
      <circle r="8" fill="#f6c77a"/>
      <g fill="#f6c77a">
        <circle cy="-12" r="2.2"/><circle cy="-12" r="2.2" transform="rotate(72)"/>
        <circle cy="-12" r="2.2" transform="rotate(144)"/><circle cy="-12" r="2.2" transform="rotate(216)"/>
        <circle cy="-12" r="2.2" transform="rotate(288)"/>
      </g>
    </g>
    <g id="fly">
      <path d="M0 0C-8-26-38-34-44-16-48-2-26 6 0 0Z"/>
      <path d="M0 0C8-26 38-34 44-16 48-2 26 6 0 0Z"/>
      <path d="M0 0C-6 10-24 22-30 12-34 4-18-2 0 0Z" opacity="0.8"/>
      <path d="M0 0C6 10 24 22 30 12 34 4 18-2 0 0Z" opacity="0.8"/>
    </g>
  </defs>
  <circle cx="360" cy="560" r="320" fill="url(#glow)"/>
  <!-- Plum branch sweeping in from the right edge -->
  <path d="M610 120C520 170 470 250 430 340S350 470 250 500M470 250c40 10 80 0 110-30M400 410c-20 50-10 100 20 140"
        fill="none" stroke="#5a2a24" stroke-width="9" stroke-linecap="round" stroke-opacity="0.85"/>
  <g fill-opacity="0.9">
    <use href="#plum" transform="translate(520 180) scale(1.2)"/>
    <use href="#plum" transform="translate(455 285) scale(0.9)"/>
    <use href="#plum" transform="translate(575 222) scale(0.7)"/>
    <use href="#plum" transform="translate(395 395) scale(1.1)"/>
    <use href="#plum" transform="translate(300 485) scale(0.8)"/>
    <use href="#plum" transform="translate(420 548) scale(0.75)"/>
  </g>
  <!-- Boo Tao -->
  <g transform="translate(300 700) rotate(-8)">
    <path d="M0-80C56-80 72-24 68 32 64 72 88 96 112 92 80 120 32 112 8 88-24 112-64 100-72 64-80 16-64-80 0-80Z"
          fill="#fbe9df" fill-opacity="0.85"/>
    <ellipse cx="-22" cy="-18" rx="7" ry="10" fill="#3a1a1c"/>
    <ellipse cx="22" cy="-18" rx="7" ry="10" fill="#3a1a1c"/>
    <path d="M-10 6q10 10 20 0" fill="none" stroke="#3a1a1c" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="-38" cy="4" rx="10" ry="5" fill="#f28a8a" fill-opacity="0.7"/>
    <ellipse cx="38" cy="4" rx="10" ry="5" fill="#f28a8a" fill-opacity="0.7"/>
  </g>
  <g fill="#ff7a52">
    <use href="#fly" transform="translate(150 260) rotate(-18) scale(1.1)" fill-opacity="0.75"/>
    <use href="#fly" transform="translate(90 470) rotate(12) scale(0.7)" fill-opacity="0.55"/>
    <use href="#fly" transform="translate(520 690) rotate(-30) scale(0.9)" fill-opacity="0.65"/>
    <use href="#fly" transform="translate(230 120) rotate(20) scale(0.55)" fill-opacity="0.45"/>
  </g>
  <g fill="#ffb05a" fill-opacity="0.5">
    <path d="M120 820c-22-30 4-50-6-80 26 22 36 50 16 80 20-8 24-30 22-44 16 24 6 52-32 44Z"/>
    <path d="M560 540c-16-22 3-36-4-58 19 16 26 36 12 58 14-6 17-22 16-32 12 17 4 38-24 32Z"/>
  </g>
</svg>
