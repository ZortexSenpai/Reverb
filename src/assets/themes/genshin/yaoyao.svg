    <use href="#leaf" transform="translate(520 380) rotate(-150) scale(0.8)"/>
    <use href="#leaf" transform="translate(570 260) rotate(-20) scale(0.6)"/>
  </g>
  <!-- Yuegui -->
  <g transform="translate(320 540)">
    <path d="M-60-110C-80-200-50-230-30-210-20-190-30-140-30-110ZM60-110C80-200 50-230 30-210 20-190 30-140 30-110Z" fill="#e8d6a8" stroke="#b08a4a" stroke-width="3"/>
    <path d="M-44-120C-56-180-42-200-34-190-30-170-34-140-34-120ZM44-120C56-180 42-200 34-190 30-170 34-140 34-120Z" fill="#f2b8c2"/>
    <ellipse rx="120" ry="110" fill="#e8d6a8" stroke="#b08a4a" stroke-width="3"/>
