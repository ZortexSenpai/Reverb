    <circle cx="-40" cy="-34" r="4" fill="#fff"/><circle cx="48" cy="-34" r="4" fill="#fff"/>
    <ellipse cx="-70" cy="0" rx="16" ry="8" fill="#e58a9a" fill-opacity="0.7"/><ellipse cx="70" cy="0" rx="16" ry="8" fill="#e58a9a" fill-opacity="0.7"/>
    <path d="M-10-6q10 10 20 0" fill="none" stroke="#2a3a22" stroke-width="4" stroke-linecap="round"/>
