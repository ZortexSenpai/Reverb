      <stop offset="1" stop-color="#0b0f1c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f7ff"/>
      <stop offset="1" stop-color="#6fb6e8"/>
