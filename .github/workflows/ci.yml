# Tests, type check and version consistency on every push and PR.
#
# The job names are what the `main` ruleset requires before a PR can merge
# (the release PR included), so renaming one means updating the ruleset too.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: vitest
        run: npm test

  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check-versions.mjs

  rust:
    name: Rust tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # The same runners the release builds on, so a platform-only
          # compile error shows up here rather than in a release.
          - platform: linux
            runner: ubuntu-22.04
          - platform: macos
            runner: macos-latest
          - platform: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        # The README's list: webkit2gtk 4.1, librsvg, ALSA (cpal), plus D-Bus
        # (media keys, device reservation) and pkg-config to find them.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libasound2-dev \
            libgtk-3-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The app crate embeds ../dist at compile time; the tests don't need a
      # real frontend build, only the directory.
      - name: Stand in for the frontend build
        run: mkdir -p dist
      - name: cargo test
        run: cargo test --workspace --locked
