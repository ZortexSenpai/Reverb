  </g>
  <circle cx="50" cy="84" r="2.5" fill="#6fb0e0"/>
  <path d="M134 40c0-8 11-9 13-3 2-6 13-5 13 2 5 0 8 7 3 9h-30c-6-1-5-8 1-8Z" fill="none" stroke="#d9b36a" stroke-width="1.8" stroke-linejoin="round"/>
