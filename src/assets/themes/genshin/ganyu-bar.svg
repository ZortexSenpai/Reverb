      <path d="M0 0C-5-7-4-15 0-19 4-15 5-7 0 0Z" transform="rotate(-50)"/>
      <path d="M0 0C-5-7-4-15 0-19 4-15 5-7 0 0Z" transform="rotate(50)"/>
