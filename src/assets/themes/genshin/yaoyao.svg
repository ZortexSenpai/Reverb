<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900">
  <!-- Yaoyao: Yuegui the jade-rabbit basket, radishes, bamboo and blossoming peach. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9ad07a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9ad07a" stop-opacity="0"/>
    </radialGradient>
    <g id="radish">
      <path d="M0 0C24 0 30 30 0 70-30 30-24 0 0 0Z" fill="#fbfdf6" stroke="#e58a9a" stroke-width="2"/>
      <path d="M0 2C-6-20-24-30-30-24-24-10-10-2 0 2ZM0 2C6-24 20-34 28-28 22-12 10-2 0 2ZM0 2C0-20 4-36 8-40 12-26 8-10 0 2Z" fill="#4f9a3a"/>
    </g>
    <g id="leaf"><path d="M0 0C20-6 50-6 70 0 50 6 20 6 0 0Z"/></g>
    <g id="peach">
      <circle cy="-10" r="10"/><circle cy="-10" r="10" transform="rotate(72)"/><circle cy="-10" r="10" transform="rotate(144)"/>
      <circle cy="-10" r="10" transform="rotate(216)"/><circle cy="-10" r="10" transform="rotate(288)"/>
    </g>
  </defs>
  <circle cx="340" cy="470" r="310" fill="url(#glow)"/>
