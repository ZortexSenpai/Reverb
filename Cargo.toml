[workspace]
resolver = "2"
members = ["src-tauri", "crates/reverb-core"]

[workspace.package]
version = "1.0.0-rc.2"
edition = "2021"
authors = ["ZortexSenpai"]
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
