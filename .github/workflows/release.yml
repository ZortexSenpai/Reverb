# Release PR → draft release → all-platform builds → publish. See RELEASING.md.
#
# release-please keeps a release PR open with the next version bump and its
# CHANGELOG.md section. Merging it creates a *draft* release (and its tag), and
# the build jobs below then run in this same workflow: a release created with
# the default GITHUB_TOKEN never triggers another workflow. The draft is
# published only once every platform has uploaded its bundles, signatures and
# latest.json entries, so installs never see a "latest" release without files.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Never cancel a run that may be halfway through uploading to a draft.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.release.outputs.tag_name }}
      body: ${{ steps.release.outputs.body }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  signing-key:
    name: Check signing key
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The Tauri CLI only warns when the key it signs with doesn't match the
      # public key the app ships, and every install would then refuse the
      # update. Prove the pair matches before spending an hour on builds.
      - name: Sign a probe file and verify it against tauri.conf.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "probe" > "$RUNNER_TEMP/probe.txt"
          npx tauri signer sign "$RUNNER_TEMP/probe.txt"
          node scripts/check-updater-key.mjs "$RUNNER_TEMP/probe.txt"

  build:
    name: Build (${{ matrix.platform }})
    needs: [release-please, signing-key]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-latest
            # One download for Apple Silicon and Intel.
            args: --target universal-apple-darwin
          - platform: windows
            runner: windows-latest
            args: ""
          - platform: linux
            # The oldest supported runner sets the glibc floor (2.35: Ubuntu
            # 22.04, Debian 12). Moving to a newer one drops distros, which
            # makes it a major release (RELEASING.md).
            runner: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        # As in CI, plus what the AppImage bundler shells out to.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libasound2-dev \
            libgtk-3-dev libdbus-1-dev pkg-config patchelf file xdg-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Upload to the draft release-please created rather than a new one.
          releaseId: ${{ needs.release-please.outputs.id }}
          # Becomes `notes` in latest.json: the release's CHANGELOG.md section,
          # which the app shows before installing.
          releaseBody: ${{ needs.release-please.outputs.body }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    # Skipped unless every build succeeded: a failed platform leaves the draft
    # for a re-run, and existing installs keep seeing the previous release.
    needs: [release-please, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: ${{ needs.release-please.outputs.id }}
    steps:
      # Each build merges its platforms into latest.json, so a lost update
      # between two of them would leave a platform out. Check before going live.
      - name: Check latest.json covers every platform
        run: |
          asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.name == "latest.json") | .id')
          [ -n "$asset" ] || { echo "::error::the draft has no latest.json"; exit 1; }
          gh api -H "Accept: application/octet-stream" \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > latest.json
          for platform in darwin-aarch64 darwin-x86_64 windows-x86_64 linux-x86_64; do
            jq -e --arg p "$platform" '.platforms[$p].url and .platforms[$p].signature' \
              latest.json > /dev/null \
              || { echo "::error::latest.json has no $platform entry"; exit 1; }
          done
      - name: Publish the draft
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false
